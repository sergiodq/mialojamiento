<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#415f91">
  <title>MiAlojamiento · Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/material3.css" data-material3>
</head>
<body class="login-page">
  <div class="hero-auth">
    <section class="auth-side" aria-label="MiAlojamiento">
      <div>
        <div class="brand-badge">M</div>
        <h1>MiAlojamiento</h1>
        <p>Tu alojamiento, en orden.</p>
      </div>
    </section>

    <section class="auth-panel-wrap">
      <div class="auth-panel">
        <div class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
          <button type="button" class="auth-tab active" data-mode="login">Ingresar</button>
          <button type="button" class="auth-tab" data-mode="register">Registrarme</button>
          <button type="button" class="auth-tab" data-mode="reset">Recuperar</button>
        </div>

        <div>
          <h2>Bienvenido</h2>
          <p>Elegí una opción para continuar.</p>
        </div>

        <div id="authMessage" aria-live="polite"></div>

        <div class="auth-pane" data-mode="login">
          <form id="loginForm" class="grid">
            <div class="field">
              <label for="login_email">Correo</label>
              <input id="login_email" name="login_email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" required>
            </div>

            <div class="field">
              <label for="login_password">Contraseña</label>
              <input id="login_password" name="login_password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <div id="loginFeedback" aria-live="polite"></div>
            <button type="submit" class="btn">Ingresar</button>
          </form>
        </div>

        <div class="auth-pane" data-mode="register" hidden>
          <div class="notice">Tu usuario debe haber sido habilitado previamente por un administrador.</div>

          <form id="registerForm" class="grid">
            <div class="field">
              <label for="register_nombre">Nombre</label>
              <input id="register_nombre" name="register_nombre" type="text" autocomplete="name" placeholder="Nombre y apellido" required>
            </div>

            <div class="field">
              <label for="register_email">Correo</label>
              <input id="register_email" name="register_email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" required>
            </div>

            <div class="grid two">
              <div class="field">
                <label for="register_password">Contraseña</label>
                <input id="register_password" name="register_password" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required>
              </div>

              <div class="field">
                <label for="register_password_confirm">Repetir contraseña</label>
                <input id="register_password_confirm" name="register_password_confirm" type="password" autocomplete="new-password" placeholder="Repetí la contraseña" required>
              </div>
            </div>

            <div id="registerFeedback" aria-live="polite"></div>
            <button type="submit" class="btn">Crear mi acceso</button>
          </form>
        </div>

        <div class="auth-pane" data-mode="reset" hidden>
          <div class="notice">Ingresá tu correo y te enviaremos un enlace para cambiar la contraseña.</div>
          <form id="resetForm" class="grid">
            <div class="field">
              <label for="reset_email">Correo</label>
              <input id="reset_email" name="reset_email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" required>
            </div>

            <div id="resetFeedback" aria-live="polite"></div>
            <button type="submit" class="btn-secondary">Enviar enlace</button>
          </form>
        </div>

        <div id="authFooterHint"></div>
      </div>
    </section>
  </div>

  <script src="env.js"></script>
  <script type="module">
    import { initLoginPage } from './js/auth.js';
    initLoginPage();
  </script>
</body>
</html>
