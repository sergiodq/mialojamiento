<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiAlojamiento · Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/material3.css">
  <link rel="stylesheet" href="css/auth-flows.css">
</head>
<body class="login-page login-premium-page">
  <div class="login-premium-shell">
    <section class="login-premium-hero">
      <div class="login-premium-overlay"></div>

      <div class="login-premium-content">
        <div class="login-brand-mark">M</div>

        <span class="login-kicker">MiAlojamiento</span>
<h1>Todo tu alojamiento, más simple y más rápido</h1>
<p>
  Reservas, propiedades y usuarios en una experiencia ágil, moderna y pensada para todos los días.
</p>

        <div class="login-feature-pills">
          <span>Reservas</span>
          <span>Propiedades</span>
          <span>Usuarios</span>
        </div>
      </div>
    </section>

    <section class="login-premium-panel-wrap">
      <div class="login-premium-card">
        <div class="login-card-head">
          <div class="login-card-brand">
            <div class="login-card-badge">M</div>
            <div>
              <strong>MiAlojamiento</strong>
              <small>Acceso seguro</small>
            </div>
          </div>
        </div>

        <div class="auth-tabs auth-tabs-premium" role="tablist" aria-label="Tipo de acceso">
          <button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true">Ingresar</button>
          <button type="button" class="auth-tab" data-auth-mode="register" role="tab" aria-selected="false">Activar cuenta</button>
        </div>

        <div class="login-panel-copy">
          <h2 id="authPaneTitle">Bienvenido</h2>
          <p id="authPaneDescription">Ingresá con tu correo y contraseña.</p>
        </div>

        <div id="authMessage"></div>

        <div class="auth-pane" data-mode="login">
          <form id="loginForm" class="grid">
            <div class="field">
              <label for="login_email">Correo</label>
              <input id="login_email" name="login_email" type="email" autocomplete="username" inputmode="email" placeholder="usuario@empresa.com" required>
            </div>

            <div class="field">
              <label for="login_password">Contraseña</label>
              <input id="login_password" name="login_password" type="password" autocomplete="current-password" placeholder="••••••••" required>
              <button type="button" class="auth-text-link auth-forgot" data-auth-mode="reset">¿Olvidaste tu contraseña?</button>
            </div>

            <div id="loginFeedback"></div>

            <button type="submit" class="btn btn-login-main">Continuar</button>
          </form>
        </div>

        <div class="auth-pane" data-mode="register" hidden>
          <form id="registerForm" class="grid">
            <div class="field">
              <label for="register_nombre">Nombre</label>
              <input id="register_nombre" name="register_nombre" type="text" autocomplete="name" placeholder="Nombre y apellido" required>
            </div>

            <div class="field">
              <label for="register_email">Correo</label>
              <input id="register_email" name="register_email" type="email" autocomplete="username" inputmode="email" placeholder="usuario@empresa.com" required>
            </div>

            <div class="grid two">
              <div class="field">
                <label for="register_password">Contraseña</label>
                <input id="register_password" name="register_password" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" required>
              </div>

              <div class="field">
                <label for="register_password_confirm">Repetir contraseña</label>
                <input id="register_password_confirm" name="register_password_confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Repetí la contraseña" required>
              </div>
            </div>

            <div id="registerFeedback"></div>

            <button type="submit" class="btn btn-login-main">Activar mi acceso</button>
            <button type="button" class="auth-text-link" data-auth-mode="login">Ya tengo una cuenta</button>
          </form>
        </div>

        <div class="auth-pane" data-mode="reset" hidden>
          <form id="resetForm" class="grid">
            <div class="field">
              <label for="reset_email">Correo</label>
              <input id="reset_email" name="reset_email" type="email" autocomplete="username" inputmode="email" placeholder="usuario@empresa.com" required>
            </div>

            <div id="resetFeedback"></div>

            <button type="submit" class="btn btn-login-main">Enviar enlace de recuperación</button>
            <button type="button" class="auth-text-link" data-auth-mode="login">Volver a ingresar</button>
          </form>
        </div>

        <div id="authFooterHint" class="login-panel-foot"></div>
      </div>
    </section>
  </div>

  <script src="env.js"></script>
  <script type="module">
    import { initLoginPage } from './js/auth.js';
    initLoginPage();
  </script>
</body>
</html>
