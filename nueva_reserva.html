<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff385c">
  <title>MiAlojamiento · Nueva reserva</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/material3.css" data-material3>
  <link rel="stylesheet" href="css/ux-vibrante.css">
  <link rel="stylesheet" href="css/responsive-final.css">
  <link rel="stylesheet" href="css/material-selects.css">
  <link rel="stylesheet" href="css/material-datetime.css">
  <link rel="stylesheet" href="css/material-app.css">
</head>
<body class="reservation-page">
  <div class="page-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="page-frame">
        <header id="topbar" class="topbar"></header>

        <section class="reservation-layout">
          <div class="card pad reservation-primary-card">
            <div id="reservationPermissionNotice" class="reservation-permission-notice" role="status" hidden></div>
            <div class="reservation-form-heading">
              <h3 id="reservationPageTitle">Nueva reserva</h3>
              <p class="reservation-intro">Completá los datos y confirmá la reserva.</p>
            </div>

            <div class="reservation-steps-header" aria-label="Pasos de la reserva">
              <span class="reservation-step-pill is-active" data-step-indicator="0">1 · Fechas</span>
              <span class="reservation-step-pill" data-step-indicator="1">2 · Huéspedes</span>
              <span class="reservation-step-pill" data-step-indicator="2">3 · Confirmar</span>
            </div>
            <p id="reservationWizardStatus" class="reservation-wizard-status" aria-live="polite" hidden></p>

            <form id="reservaForm" class="section form-grid">
              <div class="reservation-step" data-reservation-step="0">
                <h4 class="reservation-step-title">¿Dónde y cuándo?</h4>
                <div class="form-grid">
                  <div class="field full">
                    <label for="propiedad_id">Alojamiento</label>
                    <select id="propiedad_id" name="propiedad_id" required></select>
                  </div>
                  <div class="field">
                    <label for="fecha_inicio">Check-in</label>
                    <input id="fecha_inicio" name="fecha_inicio" type="date" required>
                  </div>
                  <div class="field">
                    <label for="fecha_fin">Check-out</label>
                    <input id="fecha_fin" name="fecha_fin" type="date" required>
                  </div>
                </div>
              </div>

              <div class="reservation-step" data-reservation-step="1">
                <h4 class="reservation-step-title">Habitación y huéspedes</h4>
                <div class="form-grid">
                  <div class="field full">
                    <label for="cliente">Nombre del huésped</label>
                    <input id="cliente" name="cliente" type="text" autocomplete="name" placeholder="Nombre y apellido" required>
                  </div>
                  <div class="field full">
                    <label for="unidad_id">Habitación / unidad</label>
                    <select id="unidad_id" name="unidad_id"></select>
                    <small id="unitHint">Seleccioná un alojamiento para ver sus habitaciones.</small>
                  </div>
                  <div class="field full">
                    <label class="checkbox-chip">
                      <input name="usar_unidad_manual" type="checkbox">
                      <span>Ingresar habitación manualmente</span>
                    </label>
                  </div>
                  <div id="unidadManualWrap" class="field full" hidden>
                    <div class="form-grid">
                      <div class="field">
                        <label for="unidad_manual">Nombre o código de habitación</label>
                        <input id="unidad_manual" name="unidad_manual" type="text" placeholder="Ej.: Habitación 12">
                      </div>
                      <div class="field">
                        <label for="capacidad_manual">Capacidad</label>
                        <input id="capacidad_manual" name="capacidad_manual" type="number" min="0" placeholder="Opcional">
                      </div>
                    </div>
                  </div>
                  <div class="field full">
                    <label for="huespedes">Cantidad de huéspedes</label>
                    <input id="huespedes" name="huespedes" type="number" min="1" value="1" required>
                    <small id="capacityHint">Seleccioná una habitación para ver su capacidad.</small>
                  </div>
                </div>
              </div>

              <div class="reservation-step" data-reservation-step="2">
                <h4 class="reservation-step-title">Últimos detalles</h4>
                <div class="form-grid">
                  <div class="field">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado"></select>
                  </div>
                  <div class="field">
                    <label for="total">Importe total</label>
                    <input id="total" name="total" type="number" min="0" step="1" inputmode="decimal" placeholder="Ej.: 120000">
                  </div>
                  <div class="field full">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" name="observaciones" placeholder="Agregá una nota si es necesario"></textarea>
                  </div>
                </div>
              </div>

              <div id="formFeedback" class="full" role="status" aria-live="polite"></div>

              <div class="form-actions full reservation-form-actions">
                <a class="btn-ghost" href="dashboard.html" id="reservationCancel">Cancelar</a>
                <button type="button" class="btn-ghost" id="reservationWizardBack" hidden>Anterior</button>
                <button type="button" class="btn" id="reservationWizardNext" hidden>Continuar</button>
                <button type="submit" class="btn">Guardar reserva</button>
              </div>
            </form>
            <div id="legacyHint" class="reservation-technical-note" hidden></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="env.js"></script>
  <script type="module" src="js/nueva-reserva.js"></script>
  <script type="module" src="js/reservation-wizard.js"></script>
  <script type="module" src="js/material-selects.js"></script>
  <script type="module" src="js/material-datetime.js"></script>
</body>
</html>
