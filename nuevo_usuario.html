<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff385c">
  <title>MiAlojamiento · Nuevo usuario</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/material3.css" data-material3>
  <link rel="stylesheet" href="css/ux-vibrante.css">
  <link rel="stylesheet" href="css/responsive-final.css">
  <link rel="stylesheet" href="css/material-selects.css">
  <link rel="stylesheet" href="css/material-datetime.css">
  <link rel="stylesheet" href="css/material-app.css">
  <link rel="stylesheet" href="css/layout-responsive-2026.css">
</head>
<body class="user-form-page">
  <div class="page-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <div class="page-frame">
        <header id="topbar" class="topbar"></header>

        <section class="section card pad">
          <div class="toolbar-between">
            <div>
              <h3 id="userFormTitle" style="margin:0 0 6px;">Alta de usuario</h3>
              <div class="muted">Creá o actualizá el acceso de una persona del equipo.</div>
            </div>
          </div>

          <form id="usuarioForm" class="section form-grid">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input id="nombre" name="nombre" type="text" placeholder="Nombre y apellido" required>
            </div>

            <div class="field">
              <label for="email">Correo</label>
              <input id="email" name="email" type="email" placeholder="usuario@empresa.com" required>
              <small id="emailLockHint" hidden>El correo de una cuenta activa no se puede modificar.</small>
            </div>

            <div class="field">
              <label for="rol">Rol</label>
              <select id="rol" name="rol"></select>
              <small id="roleLockHint" hidden>Este rol está protegido para mantener el acceso general.</small>
            </div>

            <div id="empresaField" class="field">
              <label for="empresa_id">Ámbito / empresa</label>
              <input id="empresa_id" name="empresa_id" type="text" placeholder="empresa-demo">
            </div>

            <div id="propiedadesAsignadasWrap" class="field full" hidden>
              <label for="propiedad_ids">Propiedades asignadas</label>
              <div id="propiedadIdsChips" class="checkbox-list property-checkbox-grid"></div>
              <select id="propiedad_ids" name="propiedad_ids" multiple hidden></select>
              <small id="propiedadesSelectedHint">Elegí los alojamientos a los que podrá acceder este usuario.</small>
            </div>

            <div id="formFeedback" class="full"></div>

            <div class="form-actions full">
              <a class="btn-ghost" href="usuarios.html">Cancelar</a>
              <button type="submit" class="btn">Guardar usuario</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="env.js"></script>
  <script type="module" src="js/nuevo-usuario.js"></script>
  <script type="module" src="js/material-selects.js"></script>
  <script type="module" src="js/material-datetime.js"></script>
</body>
</html>
